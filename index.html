<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>지제역 시세판</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
  // ↓ Apps Script 웹 앱 배포 주소
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx3S_INkVZ_RxUevJvS77fxsx9cFTZkatBBu728OPBf62fjI3PziPKIOfPnZqrvq0cG/exec";
</script>
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#15192B; --muted:#646B7D; --line:#E3E6ED;
  --brand:#5B2A86; --brand-deep:#43206A; --brand-soft:#F3ECFA; --brand-ink:#5B2A86;
  --up:#E0452F; --down:#2F6BDB; --mark:#FFE27A; --ok:#1FA971;
  --shadow:0 1px 2px rgba(21,25,43,.05), 0 8px 24px rgba(21,25,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1117; --surface:#181B25; --ink:#ECEEF4; --muted:#9AA0B2; --line:#272B38;
    --brand:#4A2370; --brand-deep:#371A55; --brand-soft:#261C35; --brand-ink:#C9A6F0;
    --up:#FF7360; --down:#7FA6FF; --mark:#7A6420; --ok:#3DD292;
    --shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:-.005em;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
main{max-width:720px; margin:0 auto; padding:20px 16px 72px}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}

/* 머리 */
header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px}
.brand{display:flex; align-items:center; gap:10px}
.logo{
  width:38px; height:38px; border-radius:11px; background:var(--brand); color:#fff;
  display:grid; place-items:center; flex:none;
}
.logo svg{width:22px; height:22px}
h1{font-size:19px; font-weight:800; letter-spacing:-.03em; margin:0; line-height:1.2}
.sub{display:block; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0}
button{
  font:inherit; font-size:14px; font-weight:650; cursor:pointer;
  border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:9px 14px; min-height:40px;
}
button:disabled{opacity:.45; cursor:default}
button:focus-visible, input:focus-visible, summary:focus-visible{outline:3px solid var(--down); outline-offset:2px}
#reload{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:none}
@media (max-width:420px){ #reload .t{display:none} #reload{padding:9px 11px} }
#reload svg{width:16px; height:16px}
#reload:disabled svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; color:var(--muted); font-size:12.5px; margin:10px 0 18px; min-height:20px}
.status .err{color:var(--up)}
.dot{display:inline-flex; align-items:center; gap:6px}
.dot::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--ok)}
.dot.off::before{background:var(--muted)}

/* 평형 선택 */
.bands{display:flex; gap:4px; padding:4px; background:var(--surface); border-radius:14px; box-shadow:var(--shadow); border:1px solid var(--line)}
.bands button{flex:1; border:none; background:transparent; border-radius:10px; min-height:40px; color:var(--muted)}
.bands button[aria-pressed="true"]{background:var(--brand); color:#fff}
.band-hint{color:var(--muted); font-size:12px; margin:8px 2px 16px}

/* 히어로: 일대 평균 */
.hero{
  background:var(--brand); color:#fff; border-radius:22px; padding:22px 20px 18px;
  position:relative; overflow:hidden; margin-bottom:16px;
}
.hero::after{ /* 지제역 선로 모티프 */
  content:""; position:absolute; right:-40px; top:-40px; width:200px; height:200px; border-radius:50%;
  border:18px solid rgba(255,255,255,.06); pointer-events:none;
}
.hero-label{margin:0; font-size:14px; color:rgba(255,255,255,.75); font-weight:500}
.hero-price{
  font-size:clamp(44px, 13vw, 64px); font-weight:800; letter-spacing:-.04em; line-height:1.05;
  font-variant-numeric:tabular-nums; margin:6px 0 10px;
}
.hero-price .won{font-size:.48em; font-weight:700; letter-spacing:-.01em; margin:0 8px 0 2px}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; background:#fff; font-variant-numeric:tabular-nums}
.pill.up{color:#E0452F} .pill.down{color:#2F6BDB}
.pill-note{font-size:12px; color:rgba(255,255,255,.7); margin-left:8px}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px}
.kpis div{background:rgba(255,255,255,.1); border-radius:14px; padding:10px 12px}
.kpis b{display:block; font-size:16px; font-weight:750; font-variant-numeric:tabular-nums; white-space:nowrap}
.kpis span{font-size:12px; color:rgba(255,255,255,.7)}
.hero-chart{margin-top:20px}
.chart svg{display:block; width:100%; overflow:visible}
.chart text{fill:rgba(255,255,255,.62); font-size:11px; font-family:inherit; font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:12.5px; color:rgba(255,255,255,.85)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{display:inline-block; width:14px; height:3px; border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 7px) !important}
.hero .empty{color:rgba(255,255,255,.75)}

/* 카드 공통 */
.card{background:var(--surface); border-radius:20px; padding:18px 18px 10px; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:16px}
.card-title{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:0 0 12px}
.card-title h2{font-size:17px; font-weight:800; letter-spacing:-.02em; margin:0}
.card-title span{font-size:12.5px; color:var(--muted)}

/* 단지 비교 */
.sort{display:flex; gap:6px; overflow-x:auto; margin:0 -18px 6px; padding:0 18px 4px; scrollbar-width:none}
.sort::-webkit-scrollbar{display:none}
.sort button{font-size:13px; padding:6px 12px; min-height:34px; font-weight:600; border-radius:999px; white-space:nowrap; background:var(--bg); border-color:transparent; color:var(--muted)}
.sort button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.crow{border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow summary{
  list-style:none; cursor:pointer; padding:13px 0;
  display:grid; grid-template-columns:26px minmax(0,1fr) auto; gap:2px 10px; align-items:start;
}
.crow summary::-webkit-details-marker{display:none}
.rank{font-size:13px; font-weight:800; color:var(--muted); padding-top:2px; font-variant-numeric:tabular-nums}
.crow.watch .rank{color:var(--brand-ink)}
.c-name{font-weight:700; font-size:15px; overflow-wrap:anywhere; line-height:1.35}
.tag{display:inline-block; font-size:11px; font-weight:750; border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:2px; background:var(--brand); color:#fff}
.c-sub{display:block; color:var(--muted); font-size:12px; margin-top:2px}
.c-avg{text-align:right; font-weight:800; font-size:16px; white-space:nowrap; font-variant-numeric:tabular-nums}
.c-avg small{display:block; font-size:12px; font-weight:650}
.c-avg .none{color:var(--muted); font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.d-only{display:none}
.c-head{display:none}
.bar{grid-column:2 / -1; height:6px; border-radius:3px; background:var(--line); margin-top:8px; position:relative}
.bar i{position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--muted); opacity:.55}
.crow.watch .bar i{background:var(--brand); opacity:1}
.bar em{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); border-radius:1px}
.c-deals{padding:2px 0 14px 36px; font-size:13px}
.c-deals div{display:flex; justify-content:space-between; gap:10px; padding:5px 0; color:var(--muted); border-top:1px dashed var(--line)}
.c-deals b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}
.card-foot{font-size:12px; color:var(--muted); margin:8px 0 6px; display:flex; align-items:center; gap:6px}
.card-foot em{display:inline-block; width:2px; height:12px; background:var(--ink)}

/* 관심 단지 */
.apt-head{display:flex; justify-content:space-between; align-items:center; gap:10px}
.apt-name{font-size:17px; font-weight:800; margin:0; letter-spacing:-.02em}
.apt-sub{font-size:12px; color:var(--brand-ink); background:var(--brand-soft); padding:3px 9px; border-radius:999px; white-space:nowrap; font-weight:600}
.apt-price{font-size:clamp(34px, 10vw, 44px); font-weight:800; letter-spacing:-.035em; line-height:1.1; margin:12px 0 2px; font-variant-numeric:tabular-nums}
.apt-price .won{font-size:.5em; font-weight:700; margin:0 6px 0 2px}
.apt-when{font-size:13px; color:var(--muted)}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0 6px}
.stats div{background:var(--bg); border-radius:12px; padding:10px 12px}
.stats b{display:block; font-size:16px; font-weight:750; font-variant-numeric:tabular-nums}
.stats span{font-size:12px; color:var(--muted)}
.deal{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px}
.deal:last-of-type{border-bottom:none}
.deal .d1{font-weight:600}
.deal .d2{grid-column:1; font-size:12px; color:var(--muted)}
.deal .p{grid-row:1 / 3; grid-column:2; align-self:center; font-weight:750; font-variant-numeric:tabular-nums}
.deal.cancel .d1, .deal.cancel .p{color:var(--muted); text-decoration:line-through}
.badge{display:inline-block; font-size:11px; font-weight:750; border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:1px}
.badge.new{background:var(--mark); color:#3A2E00}
.badge.below{border:1px solid var(--up); color:var(--up)}
.more{width:100%; margin:6px 0 8px; background:var(--bg); border-color:transparent; color:var(--muted); font-weight:600}
.empty{color:var(--muted); margin:6px 0 12px; font-size:14px}
.sec-title{font-size:17px; font-weight:800; letter-spacing:-.02em; margin:26px 2px 12px}

/* 뉴스 */
.topics{display:flex; gap:6px; overflow-x:auto; margin:0 -18px 4px; padding:0 18px 4px; scrollbar-width:none}
.topics::-webkit-scrollbar{display:none}
.topics button{font-size:13px; padding:6px 12px; min-height:34px; font-weight:600; border-radius:999px; white-space:nowrap; background:var(--bg); border-color:transparent; color:var(--muted)}
.topics button[aria-pressed="true"]{background:var(--brand); color:#fff}
.topics button b{font-weight:700; opacity:.7; margin-left:4px}
.news a{display:block; padding:12px 0; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none}
.news a:last-child{border-bottom:none}
.news a:hover .nt{text-decoration:underline}
.nt{font-size:14.5px; font-weight:600; line-height:1.45}
.nm{display:block; font-size:12px; color:var(--muted); margin-top:3px}
.nm .lbl{color:var(--brand-ink); font-weight:700; margin-right:6px}
.badge.drop{background:var(--down); color:#fff}
.badge.jump{background:var(--up); color:#fff}
.built{font-size:12px; color:var(--muted); font-weight:500; margin-left:6px}

/* 관심 단지 타일 */
.tiles{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(232px, 78%); gap:12px; overflow-x:auto; margin:0 -16px 16px; padding:2px 16px 6px; scroll-snap-type:x mandatory; scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{
  scroll-snap-align:start; text-align:left; font:inherit; color:inherit; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px 12px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:2px; min-height:186px; position:relative;
}
.tile:hover{border-color:var(--brand-ink)}
.t-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
.t-name{font-weight:750; font-size:15px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.t-area{font-size:11.5px; font-weight:650; color:var(--brand-ink); background:var(--brand-soft); border-radius:999px; padding:2px 8px; white-space:nowrap; flex:none}
.t-meta{font-size:12px; color:var(--muted)}
.t-price{font-size:26px; font-weight:800; letter-spacing:-.03em; margin-top:8px; font-variant-numeric:tabular-nums; line-height:1.15}
.t-price .won{font-size:.55em; margin:0 4px 0 1px}
.t-row{display:flex; gap:10px; font-size:12.5px; font-weight:650; font-variant-numeric:tabular-nums; flex-wrap:wrap}
.t-row .k{color:var(--muted); font-weight:500; margin-right:3px}
.t-spark{margin-top:auto; padding-top:8px}
.t-spark svg{display:block; width:100%; height:34px}
.t-badges{position:absolute; top:-7px; right:12px; display:flex; gap:4px}
.t-badges .badge{margin:0; box-shadow:0 0 0 2px var(--bg)}
.tile.add{border-style:dashed; box-shadow:none; background:transparent; align-items:center; justify-content:center; color:var(--muted); font-weight:650; gap:6px}
.tile.add b{font-size:26px; font-weight:400; line-height:1}

/* 상세 시트 */
dialog#sheet{
  border:none; padding:0; background:var(--surface); color:var(--ink);
  width:min(560px, 100%); max-height:86vh; border-radius:22px; box-shadow:0 20px 60px rgba(0,0,0,.35);
}
dialog#sheet::backdrop{background:rgba(10,12,20,.5)}
@media (max-width:640px){
  dialog#sheet{margin:auto 0 0; max-width:100%; width:100%; border-radius:22px 22px 0 0; max-height:88vh; padding-bottom:env(safe-area-inset-bottom,0)}
}
.sheet-bar{position:sticky; top:0; background:var(--surface); display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 18px 10px; border-bottom:1px solid var(--line); z-index:1}
.sheet-bar h2{margin:0; font-size:17px; font-weight:800; letter-spacing:-.02em}
.x{border:none; background:var(--bg); width:34px; height:34px; min-height:34px; padding:0; border-radius:50%; font-size:14px; color:var(--muted)}
.sheet-body{padding:6px 18px 18px; overflow-y:auto; max-height:calc(86vh - 62px)}

/* 평형별 흐름 */
.ar-title{display:flex; justify-content:space-between; align-items:baseline; margin:18px 0 4px}
.ar-title h3{font-size:14px; margin:0}
.ar-title span{font-size:11.5px; color:var(--muted)}
.ar{border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:8px}
.ar.mine{border-color:var(--brand-ink); background:var(--brand-soft)}
.ar-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.ar-name{font-weight:750; font-size:14.5px}
.ar-name small{font-weight:500; color:var(--muted); font-size:12px; margin-left:6px}
.ar-price{font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap}
.ar-last{font-size:12px; color:var(--muted); text-align:right}
.ar-chips{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px}
.ar-chips div{background:var(--bg); border-radius:10px; padding:7px 9px; font-size:12px; color:var(--muted)}
.ar.mine .ar-chips div{background:var(--surface)}
.ar-chips b{display:block; font-size:13.5px; font-weight:750; font-variant-numeric:tabular-nums; color:var(--ink)}
.ar-chips b .none{color:var(--muted); font-weight:500; font-size:12.5px}

/* 관리 */
.sec-row{display:flex; justify-content:space-between; align-items:center; margin:26px 2px 12px}
.sec-row .sec-title{margin:0}
.btn-sm{font-size:13px; padding:6px 12px; min-height:34px; border-radius:999px}
.btn-brand{background:var(--brand); color:#fff; border-color:var(--brand)}
.apt-actions{display:flex; gap:8px; margin:12px 0 4px}
.apt-actions button{flex:1; font-size:13px; min-height:36px; background:var(--bg); border-color:transparent; color:var(--muted); font-weight:600}
.apt-actions button.danger:hover{color:var(--up)}
.add-row{margin-top:10px; width:100%; font-size:13px; min-height:38px; background:var(--brand-soft); color:var(--brand-ink); border-color:transparent}
.add-row:disabled{opacity:.6}
.res{padding:12px 0; border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:none}
.res-top{display:flex; flex-direction:column; gap:1px}
.res-name{font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chips button{font-size:13px; padding:5px 11px; min-height:32px; border-radius:999px; background:var(--bg); border-color:transparent; font-weight:600}
.chips button[aria-pressed="true"]{background:var(--brand); color:#fff}
.chips button.added{opacity:.5}
.chips .cn{font-weight:500; opacity:.7}
.add-form{display:flex; gap:8px; margin-top:10px; align-items:center}
.add-form input{flex:1; min-width:0; padding:9px 12px}
.field{margin-top:12px}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px}
.row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.lock{color:var(--muted); font-size:13.5px; margin:0 0 4px}
.toast{
  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--surface); padding:11px 16px; border-radius:12px; font-size:14px;
  max-width:calc(100% - 32px); z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.2);
}

/* 단지 이름 찾기 */
details.finder{background:var(--surface); border-radius:20px; border:1px solid var(--line); padding:0 18px; margin-top:8px}
.finder > summary{cursor:pointer; padding:16px 0; font-weight:750; list-style:none; display:flex; justify-content:space-between}
.finder > summary::-webkit-details-marker{display:none}
.finder > summary::after{content:"+"; color:var(--muted); font-weight:400; font-size:20px; line-height:1}
.finder[open] > summary::after{content:"–"}
.panel{padding:0 0 18px}
input{
  font:inherit; font-size:16px; width:100%; padding:11px 14px; border-radius:12px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink);
}
.hint{color:var(--muted); font-size:12.5px; margin:8px 0 0}
.names{margin-top:8px; font-size:14px}
.names div{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.names code{font-family:inherit; font-weight:700; user-select:all}
.meta{color:var(--muted)}

/* 로딩 */
.skel{background:var(--surface); border-radius:22px; height:240px; margin-bottom:16px; border:1px solid var(--line)}
.skel.s2{height:320px; border-radius:20px}
@media (prefers-reduced-motion:no-preference){ .skel{animation:pulse 1.4s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.55}}

@media (min-width:640px){
  .tiles{grid-auto-flow:row; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); overflow:visible; margin:0 0 16px; padding:2px 0 0}
}
@media (min-width:1000px){
  main{max-width:1180px; padding-top:28px}
  .d-only{display:block; text-align:right; font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .d-only small{display:block; font-size:12px; color:var(--muted)}
  .m-only{display:none}
  .crow summary, .c-head{grid-template-columns:32px minmax(0,1fr) 70px 80px 130px 140px; gap:2px 16px}
  .c-head{display:grid; font-size:12px; color:var(--muted); padding:8px 0; border-bottom:1px solid var(--line)}
  .c-head span:nth-child(n+3){text-align:right}
  .c-deals{padding-left:48px; columns:2; column-gap:32px}
  .c-deals div{break-inside:avoid}
  .c-deals .add-row{column-span:all}
  .hero{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr); gap:36px; padding:28px 30px 24px; align-items:center}
  .hero-chart{margin-top:0}
  .cols{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:16px; align-items:start}
  .sec-title{margin-top:0}
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/></svg>
      </div>
      <h1>지제역 시세판<span class="sub">SRT 평택지제역 일대 아파트 실거래</span></h1>
    </div>
    <button id="reload" aria-label="새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span class="t">새로고침</span>
    </button>
  </header>
  <div class="status" id="status">실거래를 불러오는 중이에요. 5초 정도 걸려요.</div>

  <div id="dash" hidden>
    <div class="bands" id="bands" role="group" aria-label="평형 선택"></div>

    <div class="sec-row"><h2 class="sec-title">관심 단지</h2><button class="btn-sm btn-brand" id="addOpen">＋ 단지 추가</button></div>

    <section class="card">
      <div class="card-title"><h2>단지별 비교</h2><span id="cmpCount"></span></div>

        <button data-k="avg" aria-pressed="true">비싼 순</button>

        <button data-k="newest">신축 순</button>
        <button data-k="oldest">구축 순</button>
      </div>
      <div class="c-head" aria-hidden="true"><span></span><span>단지</span><span>준공</span><span>1년 거래</span><span>최근 거래</span><span>3개월 평균</span></div>
      <div id="cmpList"></div>
      <button class="more" id="cmpMore" hidden></button>
      <p class="card-foot"><em></em>막대 위 세로선은 일대 평균이에요. 단지를 누르면 최근 거래가 펼쳐져요.</p>
    </section>

      <div class="news" id="news"></div>
    </section>
  </div>

  <div id="loading"><div class="skel"></div><div class="skel s2"></div></div>

  <details class="finder" id="finder">
    <summary>관심 단지 추가</summary>
    <div class="panel">
      <input id="q" placeholder="단지 이름 일부 (예: 더샵, 힐스테이트)" autocomplete="off" aria-label="단지 이름 검색">
      <p class="hint">평택시 최근 1년 거래가 있는 단지에서 찾아요. 평형을 고르고 추가하면 다음 날 아침부터 알림이 와요.</p>
      <div id="names"></div>
    </div>

</main>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-bar"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose" aria-label="닫기">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const SHOW = 6;
const BANDS = [
  { id: "59", label: "59㎡대", test: (a) => a < 66, hint: "전용 66㎡ 미만" },
  { id: "74", label: "74㎡대", test: (a) => a >= 66 && a < 80, hint: "전용 66~80㎡" },
  { id: "84", label: "84㎡대", test: (a) => a >= 80 && a < 90, hint: "전용 80~90㎡" },
  { id: "L", label: "대형", test: (a) => a >= 90, hint: "전용 90㎡ 이상" },
];
const LINE_COLORS = ["#7FE0B5", "#FFC46B", "#8FD3FF", "#FF9FC8", "#D8C6FF"];
let DATA = null, BAND = "84", SORT = "avg", TOPIC = "all", CMP_ALL = false;
try { BAND = localStorage.getItem("jije-band") || "84"; } catch (e) {}

/* ── 도우미 ── */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function won(m) {
  if (m == null) return "-";
  if (!Number.isInteger(m)) m = Math.round(m / 100) * 100;
  const e = Math.floor(m / 10000), r = m % 10000;
  return (e ? e + "억" : "") + (r ? (e ? " " : "") + r.toLocaleString("ko-KR") : "");
}
function bigWon(m) {
  m = Math.round(m / 100) * 100;
  const e = Math.floor(m / 10000), r = m % 10000;
  return `${e}<span class="won">억</span>${r ? r.toLocaleString("ko-KR") : ""}`;
}
function axisWon(m) { return (m / 10000).toFixed(1) + "억"; }
function md(iso) { const [, m, d] = iso.split("-"); return `${+m}월 ${+d}일`; }
function ymd(iso) { const [y, m, d] = iso.split("-"); return `${y.slice(2)}.${m}.${d}`; }
function when(ts) {
  const d = new Date(ts);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function daysAgo(n) { return new Date(Date.now() - n * 864e5).toISOString().slice(0, 10); }
function avg(a) { return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; }
function pct(a, b) { return a != null && b ? (a / b - 1) * 100 : null; }
function chg(c, suffix = "") {
  if (c == null) return "";
  return `<span class="${c >= 0 ? "up" : "down"}">${c >= 0 ? "▲" : "▼"} ${Math.abs(c).toFixed(1)}%${suffix}</span>`;
}
const band = () => BANDS.find((b) => b.id === BAND);
const bandOf = (area) => BANDS.find((b) => b.test(area));

async function call(params) {
  const res = await fetch(GAS_URL + "?" + new URLSearchParams(params));
  const j = await res.json().catch(() => { throw new Error("Apps Script 응답을 읽지 못했어요. 웹 앱 액세스가 '모든 사용자'인지 확인해 주세요."); });
  if (j.error) throw new Error(j.error);
  return j;
}

let PIN = "";
try { PIN = localStorage.getItem("jije-pin") || ""; } catch (e) {}
async function post(body) {
  if (DATA && DATA.pinSet === false) throw new Error("Apps Script 스크립트 속성에 APP_PIN을 먼저 추가해 주세요.");
  if (!PIN) { PIN = (prompt("관리 PIN을 입력해 주세요") || "").trim(); if (!PIN) throw new Error("cancel"); }
  const res = await fetch(GAS_URL, { method: "POST", headers: { "content-type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, pin: PIN }) });
  const j = await res.json().catch(() => { throw new Error("Apps Script 응답을 읽지 못했어요. 새 버전으로 다시 배포했는지 확인해 주세요."); });
  if (j.badPin) { PIN = ""; try { localStorage.removeItem("jije-pin"); } catch (e) {} throw new Error(j.error); }
  if (j.error) throw new Error(j.error);
  try { localStorage.setItem("jije-pin", PIN); } catch (e) {}
  return j;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3000);
}
function fail(e) { if (e && e.message !== "cancel") toast(e.message); }
const aptKey = (a) => `${a.name}|${a.umd}|${a.areaMin}|${a.areaMax}`;
async function addApt(a, btn) {
  if (btn) btn.disabled = true;
  try { await post({ action: "addApt", ...a }); toast(`${a.name} 추가했어요`); await load(); }
  catch (e) { fail(e); }
  if (btn) btn.disabled = false;
}
const BAND_RANGE = { "59": [0, 66], "74": [66, 80], "84": [80, 90], "L": [90, 300] };

/* ── 불러오기 ── */
async function load() {
  const btn = $("#reload"); btn.disabled = true;
  try {
    DATA = await call({ action: "data" });
    if (!DATA.areaRows) throw new Error("Apps Script를 새 버전으로 다시 배포해 주세요. (배포 관리 → 수정 → 새 버전)");
    $("#status").innerHTML = `<span>${when(Date.now())} 기준</span>` +
      (DATA.alertsOn ? `<span class="dot">매일 오전 9시 아침 브리핑 켜짐</span>` : `<span class="dot off">메일 알림 꺼짐 (Apps Script에서 setup 실행)</span>`);
    $("#loading").hidden = true; $("#dash").hidden = false;
    renderBands(); renderBand(); renderApts(); renderNews();
    if (!$("#m1")) renderSettingsLocked();
  } catch (e) {
    $("#status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
    $("#loading").hidden = true;
  }
  btn.disabled = false;
}

/* ── 평형 ── */
function renderBands() {
  $("#bands").innerHTML = BANDS.map((b) => `<button data-b="${b.id}" aria-pressed="${b.id === BAND}">${b.label}</button>`).join("");
  $("#bands").querySelectorAll("button").forEach((btn) => btn.onclick = () => {
    BAND = btn.dataset.b;
    try { localStorage.setItem("jije-band", BAND); } catch (e) {}
    $("#bands").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === btn));
    renderBand();
  });
}
function rowsOf(b) { return DATA.areaRows.filter((r) => !r[6] && b.test(r[2])); }
function areaAvgOf(b) { const d90 = daysAgo(90); return avg(rowsOf(b).filter((r) => r[4] >= d90).map((r) => r[3])); }

function renderBand() {
  const b = band();
  const rows = rowsOf(b);
  const d90 = daysAgo(90), d180 = daysAgo(180);
  $("#bandHint").textContent = `${DATA.areaUmds.join(", ")} 기준 / ${b.hint} / 계약 해제 거래 제외`;

  const rec = rows.filter((r) => r[4] >= d90).map((r) => r[3]);
  const pri = rows.filter((r) => r[4] >= d180 && r[4] < d90).map((r) => r[3]);
  const areaAvg = avg(rec);
  const c = pct(areaAvg, avg(pri));
  const ov = $("#overview");
  if (!rows.length) {
    ov.innerHTML = `<div><p class="hero-label">지제역 일대 ${b.label}</p><p class="empty">최근 1년 동안 이 평형의 거래가 없어요.</p></div>`;
  } else {
    ov.innerHTML = `
      <div>
        <p class="hero-label">지제역 일대 ${b.label} 최근 3개월 평균</p>
        <div class="hero-price">${areaAvg ? bigWon(areaAvg) : "-"}</div>
        ${c != null ? `<span class="pill ${c >= 0 ? "up" : "down"}">${c >= 0 ? "▲" : "▼"} ${Math.abs(c).toFixed(1)}%</span><span class="pill-note">직전 3개월 대비</span>` : ""}
        <div class="kpis">
          <div><b>${rec.length}건</b><span>3개월 거래</span></div>
          <div><b>${rec.length ? won(Math.min(...rec)) : "-"}</b><span>최저</span></div>
          <div><b>${rec.length ? won(Math.max(...rec)) : "-"}</b><span>최고</span></div>
        </div>
      </div>
      <div class="hero-chart"><div class="chart" id="chart"></div><div class="legend" id="legend"></div></div>`;
    drawChart();
  }

  // 단지별
  const groups = new Map();
  for (const r of rows) {
    const k = r[0] + "|" + r[1];
    if (!groups.has(k)) groups.set(k, { name: r[0], umd: r[1], rows: [] });
    groups.get(k).rows.push(r);
  }
  const watched = new Set(DATA.apts.map((a) => a.name + "|" + a.umd));
  const list = [...groups.values()].map((g) => {
    g.rows.sort((a, z) => z[4].localeCompare(a[4]));
    const r3 = g.rows.filter((r) => r[4] >= d90).map((r) => r[3]);
    const built = (g.rows.find((r) => r[7]) || [])[7] || null;
    return { ...g, avg: avg(r3), last: g.rows[0], count: g.rows.length, built, watch: watched.has(g.name + "|" + g.umd) };
  });
  const sorters = {
    avg: (a, z) => (z.avg ?? -1) - (a.avg ?? -1),
    avgAsc: (a, z) => (a.avg ?? 1e9) - (z.avg ?? 1e9),
    count: (a, z) => z.count - a.count,
    recent: (a, z) => z.last[4].localeCompare(a.last[4]),
    newest: (a, z) => (z.built || 0) - (a.built || 0) || (z.avg ?? 0) - (a.avg ?? 0),
    oldest: (a, z) => (a.built || 9999) - (z.built || 9999) || (z.avg ?? 0) - (a.avg ?? 0),
  };
  list.sort(sorters[SORT]);
  const maxAvg = Math.max(...list.map((x) => x.avg || 0), areaAvg || 0, 1);
  $("#cmpCount").textContent = `${b.label} ${list.length}개 단지`;
  const LIMIT = 10, shown = CMP_ALL ? list : list.slice(0, LIMIT);
  $("#cmpMore").hidden = list.length <= LIMIT;
  $("#cmpMore").textContent = CMP_ALL ? "접기" : `전체 ${list.length}개 단지 보기`;
  $("#cmpList").innerHTML = shown.length ? shown.map((x, i) => {
    const deals = x.rows.slice(0, 6).map((r) => `<div><span>${ymd(r[4])} ${r[5]}층 전용 ${r[2]}㎡</span><b>${won(r[3])}</b></div>`).join("");
    return `<details class="crow${x.watch ? " watch" : ""}">
      <summary>
        <span class="rank">${i + 1}</span>
        <span><span class="c-name">${esc(x.name)}${x.watch ? '<span class="tag">관심</span>' : ""}</span>
          <span class="c-sub">${esc(x.umd)}<span class="m-only">${x.built ? ` / ${x.built}년` : ""} / 1년 ${x.count}건 / 최근 ${won(x.last[3])}</span></span></span>
        <span class="d-only">${x.built ? x.built + "년" : "-"}</span>
        <span class="d-only">${x.count}건</span>
        <span class="d-only">${won(x.last[3])}<small>${ymd(x.last[4])}</small></span>
        <span class="c-avg">${x.avg ? won(x.avg) : '<span class="none">-</span>'}<small>${x.avg ? chg(pct(x.avg, areaAvg)) : '<span class="none">3개월 거래 없음</span>'}</small></span>
        ${x.avg ? `<span class="bar"><i style="width:${(x.avg / maxAvg) * 100}%"></i>${areaAvg ? `<em style="left:${(areaAvg / maxAvg) * 100}%"></em>` : ""}</span>` : ""}
      </summary>
      <div class="c-deals">${deals}
        ${DATA.apts.some((a) => a.name === x.name && a.umd === x.umd && a.areaMin === BAND_RANGE[BAND][0] && a.areaMax === BAND_RANGE[BAND][1])
          ? "" : `<button class="add-row" data-name="${esc(x.name)}" data-umd="${esc(x.umd)}">＋ ${b.label} 관심 단지로 추가</button>`}</div>
    </details>`;
  }).join("") : `<p class="empty">이 평형의 거래가 없어요.</p>`;
  $("#cmpList").querySelectorAll(".add-row").forEach((btn) => btn.onclick = () => {
    const [mn, mx] = BAND_RANGE[BAND];
    addApt({ name: btn.dataset.name, umd: btn.dataset.umd, areaMin: mn, areaMax: mx, alertBelow: null }, btn);
  });
}

/* ── 차트 ── */
function monthly(rows) {
  return DATA.months.map((ym) => {
    const key = `${ym.slice(0, 4)}-${ym.slice(4)}`;
    return avg(rows.filter((r) => r[4].startsWith(key)).map((r) => r[3]));
  });
}
function drawChart() {
  const box = $("#chart"); if (!box) return;
  const b = band();
  const rows = rowsOf(b);
  const series = [{ label: "지제역 일대 평균", color: "#FFFFFF", vals: monthly(rows), dash: true, w: 2.5 }];
  DATA.apts.forEach((a, i) => {
    // 이 평형으로 등록한 관심 단지만 그래프에 (선이 너무 많아지지 않게)
    if (a.areaMax < 999 && bandOf((a.areaMin + a.areaMax) / 2) !== b) return;
    const own = rows.filter((r) => r[0] === a.name && (!a.umd || r[1] === a.umd));
    const src = own.length ? own : a.deals.filter((d) => !d.cancel && b.test(d.area)).map((d) => [a.name, a.umd, d.area, d.price, d.date]);
    if (src.length) series.push({ label: a.name, color: LINE_COLORS[i % LINE_COLORS.length], vals: monthly(src), w: 2.5 });
  });
  const all = series.flatMap((s) => s.vals).filter((v) => v != null);
  if (all.length < 2) { box.innerHTML = ""; $("#legend").innerHTML = ""; return; }
  let lo = Math.min(...all), hi = Math.max(...all);
  const padV = Math.max((hi - lo) * 0.12, 1000); lo -= padV; hi += padV;

  const W = Math.max(box.clientWidth, 260), H = W < 500 ? 180 : 230;
  const L = 42, R = 6, T = 8, B = 22;
  const n = DATA.months.length - 1;
  const x = (i) => L + (i / n) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

  const ticks = [lo + padV, (lo + hi) / 2, hi - padV];
  let svg = ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.16)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${axisWon(t)}</text>`).join("");
  DATA.months.forEach((ym, i) => {
    if (i % 3 === n % 3) svg += `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${ym.slice(2, 4)}.${ym.slice(4)}</text>`;
  });
  // 일대 평균 아래 옅은 면
  const s0 = series[0], p0 = s0.vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
  if (p0.length > 1) svg += `<path d="M${p0[0][0]},${H - B} ${p0.map((p) => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")} L${p0[p0.length - 1][0]},${H - B} Z" fill="rgba(255,255,255,.07)"/>`;
  for (const s of series) {
    let d = "", pen = false;
    s.vals.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen = true;
    });
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 5" opacity=".9"' : ""}/>`;
    s.vals.forEach((v, i) => {
      if (v != null) svg += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === n ? 4 : 2.6}" fill="${s.color}"${i === n ? ' stroke="#5B2A86" stroke-width="2"' : ""}><title>${s.label} ${+DATA.months[i].slice(4)}월 평균 ${won(v)}</title></circle>`;
    });
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="월별 평균 거래가 비교">${svg}</svg>`;
  $("#legend").innerHTML = series.map((s) => `<span><i class="${s.dash ? "dash" : ""}" style="background:${s.color}"></i>${esc(s.label)}</span>`).join("");
}
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => DATA && drawChart(), 150); });

$("#cmpMore").onclick = () => { CMP_ALL = !CMP_ALL; renderBand(); };
$("#sort").querySelectorAll("button").forEach((btn) => btn.onclick = () => {
  SORT = btn.dataset.k;
  $("#sort").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === btn));
  renderBand();
});

/* ── 관심 단지: 타일 + 상세 시트 ── */
function aptStats(a) {
  const valid = a.deals.filter((d) => !d.cancel);
  const d90 = daysAgo(90), d180 = daysAgo(180), d30 = daysAgo(30);
  const rec = valid.filter((d) => d.date >= d90).map((d) => d.price);
  const pri = valid.filter((d) => d.date >= d180 && d.date < d90).map((d) => d.price);
  const myAvg = avg(rec);
  const b = a.areaMax < 999 ? bandOf((a.areaMin + a.areaMax) / 2) : null;
  const flags = valid.filter((d) => d.date >= d30).map((d) => flagOf(d, valid));
  return {
    valid, last: valid[0], myAvg, trend: pct(myAvg, avg(pri)), b, vsArea: b ? pct(myAvg, areaAvgOf(b)) : null,
    built: (a.deals.find((d) => d.built) || {}).built,
    newCount: a.deals.filter((d) => d.isNew).length,
    drops: flags.filter((f) => f.includes("drop")).length,
    jumps: flags.filter((f) => f.includes("jump")).length,
    series: monthly(valid.map((d) => [0, 0, d.area, d.price, d.date])),
  };
}
function areaLabel(a) { return a.areaMax >= 999 ? "전체 면적" : a.areaMin === 0 || a.areaMax - a.areaMin > 5 ? (bandOf((a.areaMin + a.areaMax) / 2) || {}).label || "" : `${Math.round((a.areaMin + a.areaMax) / 2)}㎡`; }
function miniSpark(vals) {
  const pts = vals.map((v, i) => [i, v]).filter((p) => p[1] != null);
  if (pts.length < 2) return "";
  const lo = Math.min(...pts.map((p) => p[1])), hi = Math.max(...pts.map((p) => p[1]));
  const W = 200, H = 34, n = vals.length - 1;
  const x = (i) => (i / n) * W, y = (v) => hi === lo ? H / 2 : 3 + (1 - (v - lo) / (hi - lo)) * (H - 6);
  const d = pts.map((p, k) => `${k ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--brand-ink)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${x(last[0])}" cy="${y(last[1])}" r="3" fill="var(--brand-ink)"/></svg>`;
}
function renderApts() {
  const tiles = DATA.apts.map((a, i) => {
    const st = aptStats(a);
    const badges = [st.newCount ? `<span class="badge new">새 거래 ${st.newCount}</span>` : "",
      st.drops ? `<span class="badge drop">급락 ${st.drops}</span>` : "",
      st.jumps ? `<span class="badge jump">급상승 ${st.jumps}</span>` : ""].join("");
    return `<button class="tile" data-i="${i}">
      ${badges ? `<span class="t-badges">${badges}</span>` : ""}
      <span class="t-top"><span class="t-name">${esc(a.name)}</span><span class="t-area">${esc(areaLabel(a))}</span></span>
      <span class="t-meta">${esc(a.umd)}${st.built ? ` / ${st.built}년` : ""}</span>
      ${st.last ? `<span class="t-price">${bigWon(st.last.price)}</span>
        <span class="t-meta">${md(st.last.date)} ${st.last.floor}층 최근 거래</span>
        <span class="t-row">${st.trend != null ? `<span><span class="k">3개월</span>${chg(st.trend)}</span>` : ""}${st.vsArea != null ? `<span><span class="k">일대 대비</span>${chg(st.vsArea)}</span>` : ""}</span>
        <span class="t-spark">${miniSpark(st.series)}</span>`
      : `<span class="t-meta" style="margin-top:12px">최근 1년 거래가 없어요</span>`}
    </button>`;
  }).join("");
  $("#tiles").innerHTML = tiles + `<button class="tile add" id="tileAdd"><b>＋</b>관심 단지 추가</button>`;
  $("#tiles").querySelectorAll(".tile[data-i]").forEach((t) => t.onclick = () => openSheet(DATA.apts[+t.dataset.i]));
  $("#tileAdd").onclick = openFinder;
}

// 평형별: 직전 거래 대비, 전주 대비(최근 7일 vs 그 전 7일), 전월 대비(최근 30일 vs 그 전 30일)
function areaTrends(a) {
  let rows = DATA.areaRows.filter((r) => r[0] === a.name && r[1] === a.umd && !r[6]);
  if (!rows.length) rows = a.deals.filter((d) => !d.cancel).map((d) => [a.name, a.umd, d.area, d.price, d.date, d.floor, 0]);
  const g = new Map();
  rows.forEach((r) => { const k = Math.round(r[2]); if (!g.has(k)) g.set(k, []); g.get(k).push(r); });
  const d7 = daysAgo(7), d14 = daysAgo(14), d30 = daysAgo(30), d60 = daysAgo(60);
  return [...g.entries()].sort((x, y) => x[0] - y[0]).map(([k, rs]) => {
    rs.sort((x, y) => y[4].localeCompare(x[4]));
    const cnt = {}; rs.forEach((r) => cnt[r[2]] = (cnt[r[2]] || 0) + 1);
    const area = +Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x])[0];
    const avgIn = (from, to) => avg(rs.filter((r) => r[4] >= from && (!to || r[4] < to)).map((r) => r[3]));
    return {
      area, n: rs.length, last: rs[0], mine: area >= a.areaMin && area <= a.areaMax,
      vsPrev: rs[1] ? pct(rs[0][3], rs[1][3]) : null,
      week: pct(avgIn(d7), avgIn(d14, d7)),
      month: pct(avgIn(d30), avgIn(d60, d30)),
    };
  });
}
function trendCell(label, v) {
  return `<div>${label}<b>${v == null ? '<span class="none">거래 없음</span>' : chg(v)}</b></div>`;
}

function openSheet(a) {
  const st = aptStats(a);
  $("#sheetTitle").textContent = a.name;
  const deals = a.deals.map((d) => {
    const below = a.alertBelow && !d.cancel && d.price <= a.alertBelow;
    return `<div class="deal${d.cancel ? " cancel" : ""}">
      <span class="d1">${md(d.date)}${d.isNew ? '<span class="badge new">새 거래</span>' : ""}${flagOf(d, st.valid)}${below ? '<span class="badge below">기준가 이하</span>' : ""}${d.cancel ? " (해제)" : ""}</span>
      <span class="d2">${d.dong ? esc(d.dong) + " " : ""}${d.floor}층 / 전용 ${d.area}㎡</span>
      <span class="p">${won(d.price)}</span></div>`;
  }).join("");
  $("#sheetBody").innerHTML = `
    <p class="t-meta" style="margin:6px 0 0">${esc(a.umd)}${st.built ? ` / ${st.built}년 준공` : ""} / 전용 ${a.areaMin}~${a.areaMax}㎡${a.alertBelow ? ` / 기준가 ${won(a.alertBelow)}` : ""}</p>
    ${st.last ? `<div class="apt-price">${bigWon(st.last.price)}</div><div class="apt-when">${md(st.last.date)} 계약 ${st.last.floor}층, 가장 최근 거래</div>
    <div class="stats">
      <div><b>${st.myAvg ? won(st.myAvg) : "-"}</b><span>최근 3개월 평균 ${chg(st.trend)}</span></div>
      <div><b>${st.vsArea != null ? chg(st.vsArea) : "-"}</b><span>일대 ${st.b ? st.b.label : ""} 평균 대비</span></div>
    </div>` : `<p class="empty">최근 1년 동안 이 조건의 거래가 없어요.</p>`}
    <div class="apt-actions">
      <button id="sEdit">${a.alertBelow ? "기준가 수정" : "알림 기준가 정하기"}</button>
      <button class="danger" id="sDel">관심 해제</button>
    </div>
    <div class="ar-title"><h3>평형별 흐름</h3><span>계약일 기준 / 해제 거래 제외</span></div>
    ${areaTrends(a).map((t) => `<div class="ar${t.mine ? " mine" : ""}">
      <div class="ar-top">
        <span class="ar-name">전용 ${t.area}㎡<small>1년 ${t.n}건${t.mine ? " / 관심 평형" : ""}</small></span>
        <span><span class="ar-price">${won(t.last[3])}</span><div class="ar-last">${ymd(t.last[4])} ${t.last[5]}층</div></span>
      </div>
      <div class="ar-chips">${trendCell("직전 거래 대비", t.vsPrev)}${trendCell("전주 대비", t.week)}${trendCell("전월 대비", t.month)}</div>
    </div>`).join("")}
    <p class="hint">실거래는 계약 후 최대 30일 안에 신고돼서, 최근 1~2주는 거래가 덜 잡혀 '거래 없음'이 자주 보일 수 있어요.</p>
    <h3 style="font-size:14px; margin:18px 0 0; color:var(--muted)">관심 평형 1년 거래 ${a.deals.length}건</h3>
    ${deals}`;
  const key = aptKey(a);
  $("#sDel").onclick = async (ev) => {
    if (!confirm(`${a.name}, 관심 단지에서 뺄까요?`)) return;
    ev.target.disabled = true;
    try { await post({ action: "removeApt", key }); $("#sheet").close(); toast("관심 단지에서 뺐어요"); await load(); }
    catch (e) { fail(e); ev.target.disabled = false; }
  };
  $("#sEdit").onclick = async () => {
    const v = prompt("알림 기준가 (억 단위, 비우면 해제)\n예: 5.2", a.alertBelow ? String(a.alertBelow / 10000) : "");
    if (v === null) return;
    const n = parseFloat(v);
    try {
      await post({ action: "updateApt", key, alertBelow: n > 0 ? Math.round(n * 10000) : null });
      $("#sheet").close(); toast(n > 0 ? `기준가를 ${won(Math.round(n * 10000))}으로 정했어요` : "기준가를 해제했어요"); await load();
    } catch (e) { fail(e); }
  };
  $("#sheet").showModal();
  $("#sheetBody").scrollTop = 0;
}
$("#sheetClose").onclick = () => $("#sheet").close();
$("#sheet").addEventListener("click", (e) => { if (e.target === $("#sheet")) $("#sheet").close(); });

// 직전 90일 같은 단지 평균보다 ±ALERT_PCT% 이상이면 급락·급상승
function flagOf(d, valid) {
  if (d.cancel) return "";
  const from = new Date(new Date(d.date).getTime() - 90 * 864e5).toISOString().slice(0, 10);
  const base = valid.filter((x) => x !== d && x.date < d.date && x.date >= from).map((x) => x.price);
  if (base.length < 2) return "";
  const diff = (d.price / avg(base) - 1) * 100, t = DATA.alertPct || 5;
  if (diff <= -t) return `<span class="badge drop">급락 ${diff.toFixed(1)}%</span>`;
  if (diff >= t) return `<span class="badge jump">급상승 +${diff.toFixed(1)}%</span>`;
  return "";
}

/* ── 오늘의 소식 ── */
function ago(ts) {
  if (!ts) return "";
  const h = Math.floor((Date.now() - ts) / 3600e3);
  return h < 1 ? "방금" : h < 24 ? `${h}시간 전` : `${Math.floor(h / 24)}일 전`;
}
function renderNews() {
  const topics = (DATA.news || []).filter((t) => t.items.length);
  if (!DATA.news) { $("#newsCard").hidden = true; return; }
  const total = topics.reduce((s, t) => s + t.items.length, 0);
  if (TOPIC !== "all" && !topics.some((t) => t.label === TOPIC)) TOPIC = "all";
  $("#topics").innerHTML = [`<button data-t="all" aria-pressed="${TOPIC === "all"}">전체<b>${total}</b></button>`]
    .concat(topics.map((t) => `<button data-t="${esc(t.label)}" aria-pressed="${TOPIC === t.label}">${esc(t.label)}<b>${t.items.length}</b></button>`)).join("");
  $("#topics").querySelectorAll("button").forEach((b) => b.onclick = () => { TOPIC = b.dataset.t; renderNews(); });
  const items = topics.filter((t) => TOPIC === "all" || t.label === TOPIC)
    .flatMap((t) => t.items.map((n) => ({ ...n, label: t.label })))
    .sort((a, b) => b.at - a.at);
  $("#news").innerHTML = items.length ? items.map((n) =>
    `<a href="${esc(n.link)}" target="_blank" rel="noopener"><span class="nt">${esc(n.title)}</span>
      <span class="nm"><span class="lbl">${esc(n.label)}</span>${esc(n.source)} / ${ago(n.at)}</span></a>`).join("")
    : `<p class="empty">최근 24시간 동안 새 소식이 없어요.</p>`;
}

/* ── 관심 단지 추가 (검색) ── */
let qt, RESULTS = [];
$("#q").addEventListener("input", () => {
  clearTimeout(qt);
  qt = setTimeout(async () => {
    const q = $("#q").value.trim();
    if (!q) { $("#names").innerHTML = ""; return; }
    $("#names").innerHTML = `<p class="hint">찾는 중이에요.</p>`;
    try {
      const { list } = await call({ action: "names", q });
      RESULTS = list;
      renderResults();
    } catch (e) { $("#names").innerHTML = `<p class="hint">${esc(e.message)}</p>`; }
  }, 400);
});
function renderResults() {
  if (!RESULTS.length) { $("#names").innerHTML = `<p class="hint">찾는 단지가 없어요. 이름 일부만 넣어 보세요.</p>`; return; }
  const have = new Set(DATA ? DATA.apts.map(aptKey) : []);
  $("#names").innerHTML = RESULTS.map((x, i) => {
    const groups = new Map();   // 비슷한 면적(소수점 차이)은 한 칩으로, 표시는 가장 많은 면적
    (x.areas || []).forEach((a) => {
      const k = Math.round(a.area), g = groups.get(k) || { n: 0, top: a };
      g.n += a.n; if (a.n > g.top.n) g.top = a; groups.set(k, g);
    });
    const chips = [...groups.entries()].map(([ar, g]) => {
      const mn = ar - 2, mx = ar + 2, added = have.has(`${x.name}|${x.umd}|${mn}|${mx}`);
      return `<button data-i="${i}" data-min="${mn}" data-max="${mx}" class="${added ? "added" : ""}" ${added ? "disabled" : ""}>전용 ${g.top.area}㎡ <span class="cn">${g.n}건</span>${added ? " ✓" : ""}</button>`;
    }).join("");
    return `<div class="res">
      <div class="res-top"><span class="res-name">${esc(x.name)}</span><span class="meta" style="font-size:12px">${esc(x.umd)}${x.built ? ` / ${x.built}년` : ""} / 1년 ${x.count}건</span></div>
      <div class="chips">${chips}</div>
      <div class="add-form" hidden>
        <input type="number" inputmode="decimal" step="0.01" placeholder="알림 기준가 (선택, 억) 예: 5.2" aria-label="알림 기준가">
        <button class="btn-brand">추가</button>
      </div></div>`;
  }).join("");
  $("#names").querySelectorAll(".res").forEach((res) => {
    let pick = null;
    res.querySelectorAll(".chips button").forEach((c) => c.onclick = () => {
      res.querySelectorAll(".chips button").forEach((o) => o.setAttribute("aria-pressed", o === c));
      pick = c; res.querySelector(".add-form").hidden = false;
    });
    res.querySelector(".add-form button").onclick = async (ev) => {
      if (!pick) return;
      const x = RESULTS[+pick.dataset.i], v = parseFloat(res.querySelector(".add-form input").value);
      await addApt({ name: x.name, umd: x.umd, areaMin: +pick.dataset.min, areaMax: +pick.dataset.max, alertBelow: v > 0 ? Math.round(v * 10000) : null }, ev.target);
      renderResults();
    };
  });
}
function openFinder() { $("#finder").open = true; $("#finder").scrollIntoView({ behavior: "smooth", block: "start" }); setTimeout(() => $("#q").focus(), 300); }
$("#addOpen").onclick = openFinder;

/* ── 알림 설정 ── */
function renderSettingsLocked() {
  $("#settingsBody").innerHTML = DATA && DATA.pinSet === false
    ? `<p class="lock">화면에서 설정을 바꾸려면 Apps Script의 스크립트 속성에 <b>APP_PIN</b>을 먼저 추가해 주세요.</p>`
    : `<p class="lock">알림 메일과 급락·급상승 기준을 바꿀 수 있어요. 관리 PIN이 필요해요.</p><div class="row"><button class="btn-brand" id="unlock">PIN 입력하고 열기</button></div>`;
  const u = $("#unlock"); if (u) u.onclick = openSettings;
}
async function openSettings() {
  try {
    const s = await post({ action: "getSettings" });
    const [m1, m2] = s.emails;
    $("#settingsBody").innerHTML = `
      <div class="field"><label for="m1">알림 받는 메일 1</label><input id="m1" type="email" value="${esc(m1 || "")}"></div>
      <div class="field"><label for="m2">알림 받는 메일 2</label><input id="m2" type="email" value="${esc(m2 || "")}"></div>
      <div class="field"><label for="pct">급락·급상승 기준 (%)</label><input id="pct" type="number" inputmode="decimal" min="1" max="30" step="0.5" value="${s.alertPct}"></div>
      <p class="hint">새 거래가 그 단지 최근 3개월 평균보다 이만큼 싸거나 비싸면 표시하고 메일 제목에 알려요.</p>
      <div class="row"><button class="btn-brand" id="saveS">저장</button><button id="testS">테스트 메일 보내기</button><button class="btn-sm" id="lockS" style="margin-left:auto">이 기기 PIN 지우기</button></div>`;
    $("#saveS").onclick = async () => {
      try { await post({ action: "saveSettings", emails: [$("#m1").value, $("#m2").value], alertPct: $("#pct").value }); toast("설정을 저장했어요"); DATA.alertPct = +$("#pct").value; renderApts(); }
      catch (e) { fail(e); }
    };
    $("#testS").onclick = async (ev) => {
      ev.target.disabled = true;
      try { await post({ action: "testMail" }); toast("테스트 메일을 보냈어요"); } catch (e) { fail(e); }
      ev.target.disabled = false;
    };
    $("#lockS").onclick = () => { PIN = ""; try { localStorage.removeItem("jije-pin"); } catch (e) {} renderSettingsLocked(); toast("이 기기에서 PIN을 지웠어요"); };
  } catch (e) { fail(e); }
}
$("#settings").addEventListener("toggle", () => { if ($("#settings").open && !$("#m1")) { PIN ? openSettings() : renderSettingsLocked(); } });

$("#reload").onclick = load;
load();
</script>
